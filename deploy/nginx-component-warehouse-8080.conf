server {
  listen 127.0.0.1:8080;
  server_name _;

  root /var/www;
  index index.html;
  server_tokens off;
  absolute_redirect off;
  client_max_body_size 80m;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; base-uri 'self'; frame-ancestors 'none'" always;

  location ~ /\.(?!well-known) {
    deny all;
  }

  location ^~ /cw {
    return 410;
  }

  location ^~ /contest {
    return 410;
  }

  location ^~ /personal {
    return 410;
  }

  location ^~ /team {
    return 410;
  }

  location = /component-warehouse {
    return 301 /component-warehouse/personal/;
  }

  location = /component-warehouse/ {
    return 301 /component-warehouse/personal/;
  }

  location /component-warehouse/api/ {
    proxy_pass http://127.0.0.1:18080/api/;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /component-warehouse/health {
    proxy_pass http://127.0.0.1:18080/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /component-warehouse/health/status {
    proxy_pass http://127.0.0.1:18080/health/status;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /component-warehouse/personal {
    return 301 /component-warehouse/personal/;
  }

  location ~* ^/component-warehouse/(personal|team)/assets/.+\.(?:js|css|svg|png|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /component-warehouse/personal/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /component-warehouse/personal/index.html;
  }

  location = /component-warehouse/team {
    return 301 /component-warehouse/team/;
  }

  location = /component-warehouse/team/team-sw.js {
    default_type application/javascript;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /component-warehouse/team/team-sw.js =404;
  }

  location = /component-warehouse/team/team-manifest.webmanifest {
    default_type application/manifest+json;
    try_files /component-warehouse/team/team-manifest.webmanifest =404;
  }

  location /component-warehouse/downloads/ {
    expires 5m;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /component-warehouse/team/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /component-warehouse/team/index.html;
  }

  location ^~ /component-warehouse/v {
    return 410;
  }

  location /component-warehouse/ {
    return 404;
  }

  location / {
    return 404;
  }
}
